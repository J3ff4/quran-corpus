<!doctype html>
<html lang="en" dir="ltr">
<head>
<title>Frequency table</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Recipe lifted verbatim from `Quran Corpus Glass.dc.html` (frames 1d/1h/1i) so
   these sit beside the owner's own frames. Classes rather than the bundle's
   inline attributes -- same pixels, a quarter of the bytes -- and every one is
   `qc-` prefixed so a frame pasted back into that document cannot collide with
   its `dv-` classes. */
/* Both faces are served from the repo, so a frame renders correctly with no
   network. Amiri Quran stays on Google Fonts as the Arabic fallback only. */
@font-face{font-family:'Hafs';src:url('../../../apps/mobile/assets/fonts/hafs.18.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Newsreader';src:url('../../../apps/mobile/assets/fonts/Newsreader-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Newsreader';src:url('../../../apps/mobile/assets/fonts/Newsreader-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
body{margin:0;padding:40px 44px;background:#e9e5dc;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.qc-label{display:flex;align-items:baseline;gap:8px;font:400 11.5px/1.3 'Helvetica Neue',Helvetica,sans-serif;color:rgba(31,26,20,.6);margin:0 0 9px}
.qc-id{font:600 10.5px/1 ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(31,26,20,.09);color:#1f1a14;border-radius:5px}
.qc-frame{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background-color:#151412;box-shadow:0 26px 60px rgba(31,26,20,.32);color:#f1ede4}
.qc-status{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 0;font:500 13px/1 'Helvetica Neue',Helvetica,sans-serif;color:rgba(241,237,228,.85)}
.qc-batt{display:block;width:22px;height:10px;border:1.4px solid rgba(241,237,228,.7);border-radius:3px}
.qc-hero{border-radius:26px;background:rgba(255,255,255,.08);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.15);box-shadow:0 16px 38px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.2)}
.qc-card{border-radius:20px;background:rgba(255,255,255,.055);backdrop-filter:blur(18px) saturate(145%);border:1px solid rgba(255,255,255,.1)}
.qc-card-on{background:rgba(143,208,184,.1);border-color:rgba(143,208,184,.26)}
.qc-eyebrow{font:400 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,237,228,.5)}
.qc-mono{font:400 11.5px/1 ui-monospace,Menlo,monospace;color:rgba(241,237,228,.5)}
.qc-serif{font-family:'Newsreader',Georgia,serif;font-weight:400}
.qc-ar{font-family:'Hafs','Amiri Quran',serif}
.qc-sub{font:400 12.5px/1.5 'Helvetica Neue',Helvetica,sans-serif;color:rgba(241,237,228,.7)}
.qc-chip{padding:8px 13px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font:500 11.5px/1 'Helvetica Neue',Helvetica,sans-serif;color:rgba(241,237,228,.8)}
.qc-chip-on{background:rgba(143,208,184,.18);border-color:rgba(143,208,184,.32);color:#8fd0b8}
.qc-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qc-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 16px 0;padding:12px 18px;border-radius:22px;background:rgba(255,255,255,.08);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.15)}
.qc-back{display:block;width:11px;height:11px;border-left:1.7px solid rgba(241,237,228,.8);border-bottom:1.7px solid rgba(241,237,228,.8);transform:rotate(45deg);margin-left:4px;flex:none}
.qc-tabs{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-radius:26px;background:rgba(255,255,255,.09);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 34px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.2)}
.qc-tab{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px;font:500 10.5px/1 'Helvetica Neue',Helvetica,sans-serif;color:rgba(241,237,228,.6)}
.qc-tab-on{color:#8fd0b8}
.qc-i-read{display:block;width:17px;height:14px;border:1.6px solid currentColor;border-radius:3px}
.qc-i-browse{display:block;width:15px;height:15px;border:1.6px solid currentColor;border-radius:50%}
.qc-i-dict{display:block;width:14px;height:14px;border:1.6px solid currentColor;transform:rotate(45deg);border-radius:2px}
.qc-i-more{display:flex;flex-direction:column;gap:3px;width:16px}
.qc-i-more span{display:block;height:1.6px;background:currentColor}
/* POS buckets -- the same four the reader's segment pills use. */
.qc-pos-v{background:rgba(255,154,143,.12);border-color:rgba(255,154,143,.24);color:#ff9a8f}
.qc-pos-n{background:rgba(127,176,255,.12);border-color:rgba(127,176,255,.24);color:#7fb0ff}
.qc-pos-vn{background:rgba(195,176,232,.12);border-color:rgba(195,176,232,.24);color:#c3b0e8}
.qc-pos-adj{background:rgba(232,196,119,.12);border-color:rgba(232,196,119,.26);color:#e8c477}
.qc-pill{padding:5px 10px;border-radius:8px;font:500 10.5px/1 'Helvetica Neue',Helvetica,sans-serif}
.qc-hl{background:rgba(111,217,184,.2);border-radius:6px;padding:1px 4px}
.qc-ayah{font-family:'Hafs','Amiri Quran',serif;font-size:23px;line-height:1.95;direction:rtl;text-align:right;color:#f8f4ec;margin-top:9px}
</style>
