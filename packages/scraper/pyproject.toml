[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quran-corpus-scraper"
version = "0.1.0"
description = "Scraper and data importer for the Quranic corpus"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "tqdm>=4.67.0",
  "click>=8.1.0",
  "lxml>=5.3.0",
]

[project.scripts]
scraper = "scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
